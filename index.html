<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Training Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#0E1116;
    --slab:#161B22;
    --slab-2:#1C232C;
    --line:#252E39;
    --chalk:#E8EDF2;
    --steel:#8A97A6;
    --steel-dim:#5D6875;

    /* Section coding uses Olympic plate colours: 25 / 20 / 15 kg */
    --strength:#E33B3B;
    --accessory:#3B7BE8;
    --conditioning:#F0C419;

    --radius:14px;
    --pad:16px;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:var(--body);
    font-feature-settings:"tnum" 1,"cv05" 1;
    line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:6px}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(14,17,22,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .bar{
    display:flex;align-items:center;gap:12px;
    padding:12px var(--pad) 10px;
  }
  .title{
    font-family:var(--display);
    font-weight:800;
    font-size:17px;
    letter-spacing:-.02em;
    line-height:1.15;
    flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .icon-btn{
    width:38px;height:38px;flex:none;
    border:1px solid var(--line);border-radius:10px;
    display:grid;place-items:center;
    color:var(--steel);
    transition:border-color .15s,color .15s;
  }
  .icon-btn:hover{color:var(--chalk);border-color:var(--steel-dim)}

  .weeks{
    display:flex;gap:6px;
    padding:0 var(--pad) 10px;
    overflow-x:auto;scrollbar-width:none;
  }
  .weeks::-webkit-scrollbar{display:none}
  .wk{
    flex:none;
    min-width:44px;
    padding:7px 10px 6px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:12px;font-weight:600;
    color:var(--steel);
    text-align:center;
    position:relative;
    transition:background .15s,color .15s,border-color .15s;
  }
  .wk b{display:block;font-family:var(--display);font-size:15px;font-weight:800;line-height:1.1}
  .wk small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
  .wk.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
  .wk.deload:not(.on){border-color:#3a3320;color:#C9B369}
  .wk .dot{
    position:absolute;top:5px;right:5px;
    width:5px;height:5px;border-radius:50%;
    background:#4ADE80;opacity:0;
  }
  .wk.done .dot{opacity:1}

  .days{display:flex;gap:8px;padding:0 var(--pad) 12px}
  .day{
    flex:1;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 8px 8px;
    text-align:left;
    position:relative;
    overflow:hidden;
    transition:border-color .15s,background .15s;
  }
  .day.on{background:var(--slab-2);border-color:var(--steel-dim)}
  .day .lbl{
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--steel-dim);font-weight:600;
  }
  .day .nm{
    font-family:var(--display);font-weight:800;font-size:14px;
    letter-spacing:-.01em;color:var(--steel);margin-top:1px;
  }
  .day.on .nm{color:var(--chalk)}
  .day .prog{
    position:absolute;left:0;bottom:0;height:2px;
    background:#4ADE80;transition:width .3s ease;
  }

  /* ---------- Content ---------- */
  main{padding:18px var(--pad) 96px;max-width:640px;margin:0 auto}

  .sect{margin-bottom:22px}
  .sect-head{
    display:flex;align-items:center;gap:9px;
    margin-bottom:9px;padding-left:2px;
  }
  .chip{
    width:9px;height:9px;border-radius:2px;flex:none;
    transform:rotate(45deg);
  }
  .sect-head h2{
    margin:0;font-family:var(--display);
    font-size:12px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--steel);
  }
  .sect-head .n{margin-left:auto;font-size:11px;color:var(--steel-dim);font-weight:600}

  .card{
    background:var(--slab);
    border:1px solid var(--line);
    border-left:3px solid var(--sc,var(--line));
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:9px;
    transition:opacity .2s,background .2s;
  }
  .card.done{opacity:.42}
  .card.done .move{text-decoration:line-through;text-decoration-thickness:1.5px}

  .card-top{display:flex;gap:12px;align-items:flex-start}
  .move{
    flex:1;
    font-family:var(--display);
    font-weight:600;
    font-size:16.5px;
    letter-spacing:-.015em;
    line-height:1.28;
    margin:0;
  }
  .tick{
    flex:none;width:30px;height:30px;margin-top:-1px;
    border:1.5px solid var(--line);border-radius:9px;
    display:grid;place-items:center;
    color:transparent;
    transition:all .15s;
  }
  .tick:hover{border-color:var(--steel-dim)}
  .card.done .tick{background:#4ADE80;border-color:#4ADE80;color:var(--ink)}

  .stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .stat{
    background:var(--slab-2);
    border-radius:8px;
    padding:6px 10px 5px;
    min-width:52px;
  }
  .stat .k{
    display:block;font-size:8.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--steel-dim);font-weight:600;
  }
  .stat .v{
    display:block;font-family:var(--display);font-weight:800;
    font-size:16px;letter-spacing:-.02em;line-height:1.2;
  }
  .stat.load{background:transparent;border:1px solid var(--sc);padding:6px 12px 5px}
  .stat.load .v{color:var(--sc)}
  .stat.load .v small{font-size:10px;font-weight:600;opacity:.7;margin-left:1px}

  /* Signature: the plate loader */
  .bb{margin-top:11px}
  .bb-track{
    display:flex;align-items:center;gap:2px;height:30px;
  }
  .sleeve{flex:none;width:14px;height:4px;background:var(--steel-dim);border-radius:2px}
  .collar{flex:none;width:5px;height:16px;background:#4E5A68;border-radius:1px}
  .plate{
    flex:none;border-radius:2px;
    display:grid;place-items:center;
    font-size:8px;font-weight:700;color:rgba(0,0,0,.55);
  }
  .bb-note{
    margin-top:6px;font-size:10.5px;color:var(--steel-dim);
    letter-spacing:.02em;
  }
  .bb-note em{font-style:normal;color:var(--steel)}

  .note{
    margin-top:11px;padding-left:10px;
    border-left:2px solid var(--line);
    font-size:13px;color:var(--steel);line-height:1.5;
  }

  /* Conditioning gets a different shape - the workout text is the point */
  .card.cond .move{font-size:15.5px;font-weight:400;line-height:1.45;font-family:var(--body)}
  .card.cond .stats{margin-top:9px}

  .deload-flag{
    display:flex;align-items:center;gap:9px;
    background:rgba(240,196,25,.07);
    border:1px solid rgba(240,196,25,.22);
    border-radius:var(--radius);
    padding:11px 13px;margin-bottom:18px;
    font-size:12.5px;color:#E3CE81;
  }
  .deload-flag b{font-family:var(--display);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:var(--conditioning)}

  /* ---------- Setup sheet ---------- */
  .scrim{
    position:fixed;inset:0;z-index:40;
    background:rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--slab);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:8px var(--pad) calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    transform:translateY(101%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-width:640px;margin:0 auto;
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:34px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 16px}
  .sheet h3{
    font-family:var(--display);font-weight:800;font-size:19px;
    letter-spacing:-.02em;margin:0 0 3px;
  }
  .sheet .sub{font-size:12.5px;color:var(--steel);margin:0 0 18px}
  .field{margin-bottom:13px}
  .field label{
    display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--steel-dim);font-weight:600;margin-bottom:5px;
  }
  .field input,.field select{
    width:100%;background:var(--ink);color:var(--chalk);
    border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:16px;font-weight:600;
    font-family:var(--body);
  }
  .field input:focus,.field select:focus{border-color:var(--steel-dim);outline:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .primary{
    width:100%;background:var(--chalk);color:var(--ink);
    border-radius:11px;padding:13px;margin-top:6px;
    font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.01em;
  }
  .ghost{
    width:100%;border:1px solid var(--line);border-radius:11px;
    padding:11px;margin-top:9px;font-size:13px;color:var(--steel);
  }

  .fab{
    position:fixed;z-index:30;
    left:50%;transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));
    background:var(--slab-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 16px;
    font-size:12.5px;font-weight:600;color:var(--steel);
    display:flex;align-items:center;gap:8px;
    box-shadow:0 6px 22px rgba(0,0,0,.45);
  }
  .fab b{font-family:var(--display);font-weight:800;color:var(--chalk)}

  .empty{text-align:center;color:var(--steel-dim);padding:52px 20px;font-size:13.5px}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>

      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
      </svg>
    </button>
  </div>
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days"></div>
</header>

<main id="main"></main>

<button class="fab" id="fab"><b id="fab-n">0</b> <span>of <span id="fab-t">0</span> done today</span></button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Your maxes">
  <div class="grab"></div>
  <h3>Your maxes</h3>
  <p class="sub">Every percentage in the program loads from these. Change one and the whole block updates.</p>

  <div class="row2">
    <div class="field"><label for="m-squat">Back squat 1RM</label><input id="m-squat" type="number" inputmode="decimal" step="0.5" placeholder="110"></div>
    <div class="field"><label for="m-press">Strict press 1RM</label><input id="m-press" type="number" inputmode="decimal" step="0.5" placeholder="45"></div>
  </div>
  <div class="row2">
    <div class="field"><label for="m-clean">Clean 1RM</label><input id="m-clean" type="number" inputmode="decimal" step="0.5" placeholder="65"></div>
    <div class="field"><label for="m-deadlift">Deadlift 1RM</label><input id="m-deadlift" type="number" inputmode="decimal" step="0.5" placeholder="130"></div>
  </div>

  <div class="row2">
    <div class="field">
      <label for="s-bar">Bar weight</label>
      <select id="s-bar"><option value="20">20 kg</option><option value="15">15 kg</option><option value="10">10 kg</option><option value="0">No bar</option></select>
    </div>
    <div class="field">
      <label for="s-round">Round to</label>
      <select id="s-round"><option value="1.25">1.25 kg</option><option value="2.5">2.5 kg</option><option value="5">5 kg</option><option value="0">Exact</option></select>
    </div>
  </div>

  <button class="primary" id="save">Save</button>
  <button class="ghost" id="reset">Clear all ticks</button>
</div>

<script>
(function(){
  "use strict";

  /* ---- storage that degrades gracefully ---- */
  var mem = {};
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
  };
  function load(k,d){ var v = store.get(k); if(v==null) return d; try { return JSON.parse(v); } catch(e){ return d; } }
  function save(k,v){ store.set(k, JSON.stringify(v)); }

  /* ---- data ---- */
  var PROGRAM = JSON.parse(document.getElementById("program-data").textContent);
  if (window.PROGRAM) PROGRAM = window.PROGRAM;

  var KEY = "wod:" + (PROGRAM.title || "block").replace(/\s+/g,"-").toLowerCase();
  var maxes = load(KEY+":maxes", {squat:110, press:45, clean:65, deadlift:130});
  var opts  = load(KEY+":opts", {bar:20, round:1.25});
  var done  = load(KEY+":done", {});
  var view  = load(KEY+":view", {w:0, d:0});

  var SECTIONS = {
    Strength:     {c:"var(--strength)",     order:1},
    Accessory:    {c:"var(--accessory)",    order:2},
    Conditioning: {c:"var(--conditioning)", order:3}
  };
  var PLATES = [
    {kg:25, c:"#E33B3B", h:30},
    {kg:20, c:"#3B7BE8", h:28},
    {kg:15, c:"#F0C419", h:26},
    {kg:10, c:"#4CAF6D", h:23},
    {kg:5,  c:"#D9DDE2", h:19},
    {kg:2.5,c:"#B0B7C0", h:16},
    {kg:1.25,c:"#8A97A6",h:13}
  ];

  /* ---- helpers ---- */
  function roundTo(v, step){
    if (!step) return Math.round(v*10)/10;
    return Math.round(v/step)*step;
  }
  function fmt(n){
    return (Math.round(n*100)/100).toString();
  }
  function workingWeight(item){
    if (!item.pct || !item.lift) return null;
    var max = parseFloat(maxes[item.lift]);
    if (!max || isNaN(max)) return null;
    return roundTo(max * item.pct, parseFloat(opts.round));
  }
  function plateBreakdown(total){
    var bar = parseFloat(opts.bar) || 0;
    if (total <= bar) return null;
    var side = (total - bar) / 2, out = [], rem = side;
    for (var i=0;i<PLATES.length;i++){
      var p = PLATES[i];
      while (rem >= p.kg - 0.001){ out.push(p); rem -= p.kg; }
    }
    return {plates: out, left: Math.round(rem*100)/100, side: side};
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function idOf(w,d,i){ return "w"+w+"d"+d+"i"+i; }

  function curWeek(){ return PROGRAM.weeks[view.w]; }
  function curDay(){ var w = curWeek(); return w && w.days[view.d]; }

  function dayStats(wi, di){
    var w = PROGRAM.weeks[wi]; if(!w) return {n:0,t:0};
    var d = w.days[di]; if(!d) return {n:0,t:0};
    var n = 0;
    for (var i=0;i<d.items.length;i++) if (done[idOf(w.week, d.day, i)]) n++;
    return {n:n, t:d.items.length};
  }
  function weekDone(wi){
    var w = PROGRAM.weeks[wi], tot=0, n=0;
    for (var i=0;i<w.days.length;i++){ var s = dayStats(wi,i); tot += s.t; n += s.n; }
    return tot>0 && n===tot;
  }

  /* ---- render ---- */
  function renderWeeks(){
    var el = document.getElementById("weeks"), h = "";
    for (var i=0;i<PROGRAM.weeks.length;i++){
      var w = PROGRAM.weeks[i];
      h += '<button class="wk'+(i===view.w?" on":"")+(w.deload?" deload":"")+(weekDone(i)?" done":"")+'" data-w="'+i+'">'
        + '<small>WK</small><b>'+w.week+'</b><span class="dot"></span></button>';
    }
    el.innerHTML = h;
    var on = el.querySelector(".wk.on");
    if (on) on.scrollIntoView({block:"nearest", inline:"center"});
  }

  function renderDays(){
    var el = document.getElementById("days"), w = curWeek(), h = "";
    if (!w) { el.innerHTML=""; return; }
    for (var i=0;i<w.days.length;i++){
      var s = dayStats(view.w, i);
      var pct = s.t ? (s.n/s.t*100) : 0;
      h += '<button class="day'+(i===view.d?" on":"")+'" data-d="'+i+'">'
        + '<span class="lbl">Day</span>'
        + '<span class="nm">'+w.days[i].day+'</span>'
        + '<span class="prog" style="width:'+pct+'%"></span></button>';
    }
    el.innerHTML = h;
  }

  function barbellHTML(total, colour){
    var b = plateBreakdown(total);
    if (!b || !b.plates.length){
      return '<div class="bb"><div class="bb-note">Under bar weight &mdash; use dumbbells or an empty bar.</div></div>';
    }
    var h = '<div class="bb"><div class="bb-track"><span class="sleeve"></span>';
    var counts = [], last = null;
    for (var i=0;i<b.plates.length;i++){
      var p = b.plates[i];
      h += '<span class="plate" style="background:'+p.c+';width:'+(p.kg>=10?11:9)+'px;height:'+p.h+'px"></span>';
    }
    h += '<span class="collar"></span></div>';

    // tally for the text line
    var tally = {}, order = [];
    for (var j=0;j<b.plates.length;j++){
      var kg = b.plates[j].kg;
      if (!tally[kg]) { tally[kg]=0; order.push(kg); }
      tally[kg]++;
    }
    var parts = order.map(function(kg){ return tally[kg]+"&times;"+fmt(kg); });
    var note = "<em>Per side:</em> " + parts.join(" + ");
    if (b.left > 0.01) note += " &middot; " + fmt(b.left) + " kg short";
    h += '<div class="bb-note">'+note+'</div></div>';
    return h;
  }

  function cardHTML(item, idx, wNum, dNum){
    var meta = SECTIONS[item.section] || {c:"var(--line)"};
    var id = idOf(wNum, dNum, idx);
    var isDone = !!done[id];
    var cond = item.section === "Conditioning";
    var ww = workingWeight(item);

    var h = '<article class="card'+(isDone?" done":"")+(cond?" cond":"")+'" style="--sc:'+meta.c+'" data-id="'+id+'">'
      + '<div class="card-top">'
      + '<h3 class="move">'+esc(item.movement || "Rest / coach&rsquo;s call")+'</h3>'
      + '<button class="tick" aria-label="Mark done" data-tick="'+id+'">'
      + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
      + '</button></div>';

    var stats = "";
    if (item.sets) stats += '<div class="stat"><span class="k">Sets</span><span class="v">'+item.sets+'</span></div>';
    if (item.reps != null) stats += '<div class="stat"><span class="k">Reps</span><span class="v">'+esc(item.reps)+'</span></div>';
    if (item.pct) stats += '<div class="stat"><span class="k">% 1RM</span><span class="v">'+Math.round(item.pct*100)+'</span></div>';
    if (ww != null) stats += '<div class="stat load"><span class="k">Working</span><span class="v">'+fmt(ww)+'<small>kg</small></span></div>';
    else if (item.pct) stats += '<div class="stat"><span class="k">Working</span><span class="v">&mdash;</span></div>';
    if (stats) h += '<div class="stats">'+stats+'</div>';

    if (ww != null) h += barbellHTML(ww, meta.c);
    if (item.notes) h += '<p class="note">'+esc(item.notes)+'</p>';

    return h + '</article>';
  }

  function render(){
    renderWeeks();
    renderDays();

    var w = curWeek(), d = curDay(), main = document.getElementById("main");
    document.getElementById("title").textContent = PROGRAM.title || "Training Block";

    if (!d){ main.innerHTML = '<p class="empty">No sessions in this week yet.</p>'; return; }

    var h = "";
    if (w.deload){
      h += '<div class="deload-flag"><b>Deload</b><span>Lighter on purpose. Move well, leave something in the tank.</span></div>';
    }

    // group by section, keeping the coach's ordering within each
    var groups = {}, order = [];
    for (var i=0;i<d.items.length;i++){
      var s = d.items[i].section;
      if (!groups[s]) { groups[s] = []; order.push(s); }
      groups[s].push({item:d.items[i], idx:i});
    }
    order.sort(function(a,b){
      return ((SECTIONS[a]||{order:9}).order) - ((SECTIONS[b]||{order:9}).order);
    });

    for (var k=0;k<order.length;k++){
      var s = order[k], meta = SECTIONS[s] || {c:"var(--line)"};
      h += '<section class="sect"><div class="sect-head">'
        + '<span class="chip" style="background:'+meta.c+'"></span>'
        + '<h2>'+esc(s)+'</h2><span class="n">'+groups[s].length+'</span></div>';
      for (var m=0;m<groups[s].length;m++){
        h += cardHTML(groups[s][m].item, groups[s][m].idx, w.week, d.day);
      }
      h += '</section>';
    }
    main.innerHTML = h;

    var st = dayStats(view.w, view.d);
    document.getElementById("fab-n").textContent = st.n;
    document.getElementById("fab-t").textContent = st.t;
  }

  /* ---- events ---- */
  document.getElementById("weeks").addEventListener("click", function(e){
    var b = e.target.closest("[data-w]"); if(!b) return;
    view.w = +b.dataset.w; view.d = 0; save(KEY+":view", view); render();
    window.scrollTo({top:0, behavior:"smooth"});
  });
  document.getElementById("days").addEventListener("click", function(e){
    var b = e.target.closest("[data-d]"); if(!b) return;
    view.d = +b.dataset.d; save(KEY+":view", view); render();
    window.scrollTo({top:0, behavior:"smooth"});
  });
  document.getElementById("main").addEventListener("click", function(e){
    var b = e.target.closest("[data-tick]"); if(!b) return;
    var id = b.dataset.tick;
    if (done[id]) delete done[id]; else done[id] = 1;
    save(KEY+":done", done);
    var card = b.closest(".card");
    card.classList.toggle("done", !!done[id]);
    var st = dayStats(view.w, view.d);
    document.getElementById("fab-n").textContent = st.n;
    renderDays(); renderWeeks();
  });

  /* ---- setup sheet ---- */
  var sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  function openSheet(){
    document.getElementById("m-squat").value = maxes.squat || "";
    document.getElementById("m-press").value = maxes.press || "";
    document.getElementById("m-clean").value = maxes.clean || "";
    document.getElementById("m-deadlift").value = maxes.deadlift || "";
    document.getElementById("s-bar").value = opts.bar;
    document.getElementById("s-round").value = opts.round;
    sheet.classList.add("open"); scrim.classList.add("open");
  }
  function closeSheet(){ sheet.classList.remove("open"); scrim.classList.remove("open"); }

  document.getElementById("open-setup").addEventListener("click", openSheet);
  document.getElementById("fab").addEventListener("click", openSheet);
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

  document.getElementById("save").addEventListener("click", function(){
    maxes = {
      squat:    parseFloat(document.getElementById("m-squat").value) || 0,
      press:    parseFloat(document.getElementById("m-press").value) || 0,
      clean:    parseFloat(document.getElementById("m-clean").value) || 0,
      deadlift: parseFloat(document.getElementById("m-deadlift").value) || 0
    };
    opts = {
      bar:   parseFloat(document.getElementById("s-bar").value),
      round: parseFloat(document.getElementById("s-round").value)
    };
    save(KEY+":maxes", maxes); save(KEY+":opts", opts);
    closeSheet(); render();
  });

  document.getElementById("reset").addEventListener("click", function(){
    if (!confirm("Clear every tick across the whole block?")) return;
    done = {}; save(KEY+":done", done); render();
  });

  render();
})();
</script>
</body>
</html>
